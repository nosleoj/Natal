<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Clean AI</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --deep-space: #02060c;
            --glass: rgba(0, 242, 255, 0.05);
            --border-glass: rgba(0, 242, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--deep-space);
            color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            margin-top: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            margin: 0;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        /* Scan Area */
        .scan-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed var(--border-glass);
            border-radius: 50%;
            animation: rotate 10s linear infinite;
        }

        .inner-core {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, var(--neon-blue) 0%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 40px var(--neon-blue);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Status Cards */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            margin-bottom: 20px;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border-glass);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .card span {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }

        .card b {
            font-size: 1.2rem;
            color: var(--neon-blue);
        }

        /* Button */
        .btn-main {
            width: 85%;
            padding: 18px;
            margin-bottom: 30px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2);
            transition: all 0.3s;
        }

        .btn-main:active {
            transform: scale(0.95);
            background: var(--neon-blue);
            color: var(--deep-space);
        }

        /* Animations */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        /* Overlay de Loading */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>ULTRA<span style="font-weight: 300;">SPEED</span></h1>
        <p id="system-status" style="font-size: 0.8rem; color: #00f2ff;">DISPOSITIVO LENTO</p>
    </header>

    <div class="scan-container">
        <div class="outer-ring"></div>
        <div class="inner-core" id="main-core"></div>
    </div>

    <div class="info-grid">
        <div class="card">
            <span>RESÍDUOS</span>
            <b id="junk-size">1.8 GB</b>
        </div>
        <div class="card">
            <span>AMEAÇAS</span>
            <b id="virus-count" style="color: #ff4444;">12</b>
        </div>
    </div>

    <button class="btn-main" onclick="startClean()">INICIAR VARREDURA</button>

    <div id="overlay">
        <div class="inner-core" style="width: 80px; height: 80px;"></div>
        <h3 id="loader-text" style="margin-top: 20px;">ANALISANDO...</h3>
        <p id="file-name" style="font-size: 0.7rem; color: #888;"></p>
    </div>

    <script>
        function startClean() {
            const overlay = document.getElementById('overlay');
            const loaderText = document.getElementById('loader-text');
            const fileName = document.getElementById('file-name');
            const core = document.getElementById('main-core');
            
            overlay.style.display = 'flex';
            
            const tasks = [
                { t: "Escaneando Root...", d: 1000 },
                { t: "Eliminando Vírus...", d: 2000 },
                { t: "Limpando Cache do Sistema...", d: 3500 },
                { t: "Otimizando Registros...", d: 5000 },
                { t: "Finalizando...", d: 6000 }
            ];

            tasks.forEach(task => {
                setTimeout(() => {
                    loaderText.innerText = task.t;
                }, task.d);
            });

            // Efeito de conclusão
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('junk-size').innerText = "0 KB";
                document.getElementById('virus-count').innerText = "0";
                document.getElementById('virus-count').style.color = "#00f2ff";
                document.getElementById('system-status').innerText = "DISPOSITIVO PROTEGIDO";
                document.getElementById('system-status').style.color = "#00ff88";
                core.style.boxShadow = "0 0 60px #00ff88";
                alert("Otimização concluída! Seu celular agora está rápido como uma bala.");
            }, 6500);
        }
    </script>
</body>
</html>
